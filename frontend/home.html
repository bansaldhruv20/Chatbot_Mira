<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mira · Food Ordering</title>

    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
</head>

<body>
    <header>
        <h1>Mira</h1>
        <p>Food ordering &amp; order tracking</p>
    </header>

    <main>
        <section>
            <h2>Our Menu</h2>
            <p>Prices use the original project's demo units.</p>

            <div id="menu" class="menu"></div>
        </section>

        <section>
            <h2>Your Conversation</h2>

            <p>
                This local demo uses menu controls.
                The Dialogflow webhook uses the same ordering service.
            </p>

            <div
                id="messages"
                role="log"
                aria-live="polite"
            ></div>

            <div class="controls">
                <button id="cart" type="button">
                    View cart
                </button>

                <button id="confirm" type="button">
                    Confirm order
                </button>

                <button id="new" type="button">
                    New order
                </button>
            </div>

            <form id="tracking">
                <label for="order-id">Track order ID</label>

                <input
                    id="order-id"
                    type="number"
                    min="1"
                    step="1"
                    required
                >

                <button type="submit">
                    Track order
                </button>
            </form>

            <p id="status" role="status"></p>
        </section>
    </main>

    <footer>
        Demo: add items, remove an item, confirm,
        then track the returned order ID.
    </footer>
</body>
</html>
